<script>
    let currentViewDate = new Date();
    
    const events = {};

    function updateStatusClock() {
        const clockEl = document.getElementById('clock-display');
        if (!clockEl) return;
        const now = new Date();
        let h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, '0');
        const ampm = h >= 12 ? '午後' : '午前';
        h = h % 12 || 12;
        clockEl.textContent = `${ampm} ${h}:${m}`;
    }

    function showBubble(title, message) {
        const bubble = document.getElementById('event-bubble');
        const tag = document.getElementById('bubble-tag');
        const body = document.getElementById('bubble-body');
        if (!bubble || !tag || !body) return;
        tag.textContent = title;
        body.textContent = message;
        bubble.style.display = 'block';
    }

    function hideBubble() {
        const bubble = document.getElementById('event-bubble');
        if (bubble) bubble.style.display = 'none';
    }

    function goToToday() {
        currentViewDate = new Date();
        hideBubble();
        renderCalendar();
    }

    function changeMonth(offset) {
        currentViewDate = new Date(currentViewDate.getFullYear(), currentViewDate.getMonth() + offset, 1);
        hideBubble();
        renderCalendar();
    }

    function renderCalendar() {
        const year = currentViewDate.getFullYear();
        const month = currentViewDate.getMonth();
        
        const firstDayOfMonth = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const prevMonthDays = new Date(year, month, 0).getDate();

        const grid = document.getElementById('calendar-grid');
        const label = document.getElementById('month-year-label');
        if (!grid || !label) return;
        
        label.textContent = `${year}年 ${month + 1}月`;
        grid.innerHTML = '';

        const realToday = new Date();

        for (let i = firstDayOfMonth - 1; i >= 0; i--) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            cell.textContent = prevMonthDays - i;
            grid.appendChild(cell);
        }

        for (let i = 1; i <= daysInMonth; i++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell current-month';
            
            const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            
            if (realToday.getFullYear() === year && realToday.getMonth() === month && i === realToday.getDate()) {
                cell.classList.add('today');
            }

            if (events[dateKey]) {
                cell.classList.add('has-event');
                cell.onclick = () => showBubble(`${month + 1}月${i}日の予定`, events[dateKey]);
            } else {
                cell.onclick = () => hideBubble();
            }

            cell.textContent = i;
            grid.appendChild(cell);
        }

        const currentTotal = grid.children.length;
        const rowsNeeded = Math.ceil(currentTotal / 7);
        const totalCells = rowsNeeded * 7;
        const remaining = totalCells - currentTotal;
        
        for (let i = 1; i <= remaining; i++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            cell.textContent = i;
            grid.appendChild(cell);
        }
    }

    setInterval(updateStatusClock, 1000);
    updateStatusClock();
    renderCalendar();
</script>

  <script>
    const siteLastUpdatedAt = "2026-05-03T13:30:00";

    function formatRelativeAge(dateString) {
        const now = new Date();
        const past = new Date(dateString);
        const diffInSeconds = Math.floor((now - past) / 1000);

        if (diffInSeconds < 60) return "just now";
        
        const minutes = Math.floor(diffInSeconds / 60);
        if (minutes < 60) return minutes + "m ago";
        
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + "h ago";
        
        const days = Math.floor(hours / 24);
        return days + "d ago";
    }

    function refreshUpdateAge() {
        const display = document.getElementById('updated-display');
        if (!display) return;
        display.innerText = formatRelativeAge(siteLastUpdatedAt);
    }

    if (document.getElementById('updated-display')) {
        refreshUpdateAge();
        setInterval(refreshUpdateAge, 30000);
    }
  </script>
  <script>
document.addEventListener('DOMContentLoaded', () => {
    const daytimeTracks = [];

    const nighttimeTracks = [];

    function safeGetStorage(key) {
        try {
            return localStorage.getItem(key);
        } catch (e) {
            return null;
        }
    }

    let activeTrackIndex = 0;
    let musicMenuOpen = false;
    let musicPermissionGranted = false;

    let audio = document.getElementById('ipod-audio-engine');
    if (!audio) {
        audio = new Audio();
        audio.id = 'ipod-audio-engine';
        document.body.appendChild(audio);
    }

    const titleEl = document.getElementById('ipod-title');
    const artistEl = document.getElementById('ipod-artist');
    const albumEl = document.getElementById('ipod-album');
    const dateEl = document.getElementById('ipod-date');
    const coverEl = document.getElementById('album-cover');
    const labelEl = document.getElementById('vinyl-label');
    const streamLinkEl = document.getElementById('ipod-stream-link');
    const vinylDisc = document.getElementById('vinyl-disc');

    const nowPlayingView = document.getElementById('ipod-now-playing');
    const menuView = document.getElementById('ipod-menu');
    const playlistUl = document.getElementById('ipod-playlist-ul');
    const progressFill = document.getElementById('progress-fill');
    const progressContainer = document.getElementById('progress-container') || progressFill?.parentElement;
    
    const currTimeEl = document.getElementById('curr-time');
    const durTimeEl = document.getElementById('dur-time');

    function isMusicAllowed() {
        return musicPermissionGranted || safeGetStorage('i026-music-enabled') === 'true';
    }

    function getCurrentTracklist() {
        return document.body.classList.contains('night-mode') ? nighttimeTracks : daytimeTracks;
    }

    function formatAudioTime(secs) {
        if (isNaN(secs) || !isFinite(secs)) return "0:00";
        const mins = Math.floor(secs / 60);
        const remainingSecs = Math.floor(secs % 60);
        return `${mins}:${remainingSecs < 10 ? '0' : ''}${remainingSecs}`;
    }

    function loadAudioTrack(index, autoplay = false) {
        if (!audio) return;

        const playlist = getCurrentTracklist();
        if (!playlist || playlist.length === 0) return;

        activeTrackIndex = ((index % playlist.length) + playlist.length) % playlist.length;
        const track = playlist[activeTrackIndex];

        audio.pause();
        audio.src = track.url;
        audio.load();

        if (progressFill) progressFill.style.width = '0%';
        if (currTimeEl) currTimeEl.textContent = '0:00';
        if (durTimeEl) durTimeEl.textContent = '0:00';

        if (titleEl) {
            titleEl.textContent = track.title;
            titleEl.title = `Title: ${track.title}`;
        }
        if (artistEl) {
            artistEl.textContent = track.artist;
            artistEl.title = `Artist: ${track.artist}`;
        }
        if (albumEl) {
            const albumName = track.album || "Single";
            albumEl.textContent = albumName;
            albumEl.title = `Album: ${albumName}`;
        }
        if (dateEl) {
            const releaseDate = track.date || "";
            dateEl.textContent = releaseDate;
            dateEl.title = `Release: ${releaseDate}`;
        }

        if (coverEl) coverEl.style.backgroundImage = `url('${track.cover}')`;
        if (labelEl) labelEl.style.backgroundImage = `url('${track.cover}')`;
        if (streamLinkEl) streamLinkEl.href = track.spotifyUrl;

        drawMusicMenu();

        if (autoplay && isMusicAllowed()) {
            tryToAutoplay();
        }
    }

    function toggleAudioPlayback() {
        if (!audio) return;
        if (audio.paused) {
            musicPermissionGranted = true;
            audio.play().catch(err => console.log(err));
        } else {
            audio.pause();
        }
    }

    function drawMusicMenu() {
        if (!playlistUl) return;
        const playlist = getCurrentTracklist();
        playlistUl.innerHTML = '';

        playlist.forEach((track, i) => {
            const li = document.createElement('li');
            li.textContent = `${i + 1}. ${track.title}`;
            li.title = `${track.title} - ${track.artist}`;
            if (i === activeTrackIndex) li.classList.add('active');

            li.addEventListener('click', () => {
                musicPermissionGranted = true;
                loadAudioTrack(i, true);
                setMusicMenu(false);
            });

            playlistUl.appendChild(li);
        });
    }

    function setMusicMenu(show) {
        if (!nowPlayingView || !menuView) return;
        
        musicMenuOpen = show !== undefined ? show : !musicMenuOpen;
        
        if (musicMenuOpen) {
            nowPlayingView.classList.add('hidden');
            menuView.classList.remove('hidden');
            drawMusicMenu();
        } else {
            menuView.classList.add('hidden');
            nowPlayingView.classList.remove('hidden');
        }
    }

    function handleMusicCenterButton() {
        if (musicMenuOpen) {
            musicPermissionGranted = true;
            loadAudioTrack(activeTrackIndex, true);
            setMusicMenu(false);
        } else {
            toggleAudioPlayback();
        }
    }

    function tryToAutoplay() {
        if (!audio) return;

        const playPromise = audio.play();

        if (playPromise !== undefined) {
            playPromise.catch(() => {
                console.log("Autoplay blocked. Listening for user interaction...");

                const unlockAudio = () => {
                    if (isMusicAllowed()) {
                        audio.play().catch(e => console.log("Play error:", e));
                    }

                    document.removeEventListener('click', unlockAudio);
                    document.removeEventListener('keydown', unlockAudio);
                    document.removeEventListener('touchstart', unlockAudio);
                };

                document.addEventListener('click', unlockAudio);
                document.addEventListener('keydown', unlockAudio);
                document.addEventListener('touchstart', unlockAudio);
            });
        }
    }

    document.getElementById('btn-play')?.addEventListener('click', handleMusicCenterButton);
    document.getElementById('btn-menu')?.addEventListener('click', () => setMusicMenu());
    
    document.getElementById('btn-prev')?.addEventListener('click', () => {
        const shouldPlay = !audio.paused || isMusicAllowed();
        if (shouldPlay) musicPermissionGranted = true;
        loadAudioTrack(activeTrackIndex - 1, shouldPlay);
        if (musicMenuOpen) drawMusicMenu();
    });

    document.getElementById('btn-next')?.addEventListener('click', () => {
        const shouldPlay = !audio.paused || isMusicAllowed();
        if (shouldPlay) musicPermissionGranted = true;
        loadAudioTrack(activeTrackIndex + 1, shouldPlay);
        if (musicMenuOpen) drawMusicMenu();
    });

    document.getElementById('btn-vol')?.addEventListener('click', () => {
        if (!audio) return;
        audio.muted = !audio.muted;
        const volBtn = document.getElementById('btn-vol');
        if (volBtn) volBtn.style.opacity = audio.muted ? '0.4' : '1.0';
    });

    if (progressContainer) {
        progressContainer.style.cursor = 'pointer';
        progressContainer.addEventListener('click', (e) => {
            if (!audio.duration || isNaN(audio.duration)) return;
            
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            if (!width) return;
            
            const newTime = (clickX / width) * audio.duration;
            audio.currentTime = Math.max(0, Math.min(newTime, audio.duration));
        });
    }

    if (audio) {
        audio.addEventListener('play', () => {

  <script>
document.addEventListener('DOMContentLoaded', () => {
    if (
        !document.getElementById('cpu-chart') &&
        !document.getElementById('ram-chart') &&
        !document.getElementById('net-chart') &&
        !document.getElementById('cpu-val') &&
        !document.getElementById('ram-val') &&
        !document.getElementById('net-val')
    ) {
        return;
    }

    const graphHistoryLength = 20;
    const cpuSamples = new Array(graphHistoryLength).fill(0);
    const ramSamples = new Array(graphHistoryLength).fill(0);
    const networkSamples = new Array(graphHistoryLength).fill(0);

    function drawMetricGraph(canvasId, historyArray, maxVal, color) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        ctx.strokeStyle = '#d8d8d8';
        ctx.lineWidth = 0.5;
        ctx.beginPath();

        const horizontalRows = 4;
        const rowSpacing = height / horizontalRows;
        for (let i = 1; i < horizontalRows; i++) {
            const y = i * rowSpacing;
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
        }

        const verticalCols = 6;
        const colSpacing = width / verticalCols;
        for (let j = 1; j < verticalCols; j++) {
            const x = j * colSpacing;
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
        }

        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;

        const step = width / (graphHistoryLength - 1);

        for (let i = 0; i < historyArray.length; i++) {
            const val = Math.min(historyArray[i], maxVal);
            const y = height - ((val / maxVal) * (height - 2) + 1);
            const x = i * step;

            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }
        ctx.stroke();
    }

    let lastTime = performance.now();
    function refreshCpuMetric() {
        const cpuVal = document.getElementById('cpu-val');
        const now = performance.now();
        const delta = now - lastTime;
        lastTime = now;

        const expectedDelta = 1000;
        const delay = Math.max(0, delta - expectedDelta);
        
        let cpuPercent = Math.min(100, Math.round((delay / 20) * 100) + Math.floor(Math.random() * 5) + 2);

        if (cpuVal) cpuVal.textContent = `${cpuPercent}%`;

        cpuSamples.shift();
        cpuSamples.push(cpuPercent);
        drawMetricGraph('cpu-chart', cpuSamples, 100, '#a6a6a6');
    }

    function refreshRamMetric() {
        const ramVal = document.getElementById('ram-val');
        let percentage = 0;

        if (performance && performance.memory) {
            const usedMB = (performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(1);
            const totalMB = (performance.memory.jsHeapSizeLimit / (1024 * 1024)).toFixed(0);
            percentage = Math.round((Number(usedMB) / Number(totalMB)) * 100);
            if (ramVal) ramVal.textContent = `${usedMB} MB (${percentage}%)`;
        } else {
            percentage = Math.floor(Math.random() * 6) + 28;
            if (ramVal) ramVal.textContent = `Active (${percentage}%)`;
        }

        ramSamples.shift();
        ramSamples.push(percentage);
        drawMetricGraph('ram-chart', ramSamples, 100, '#a6a6a6');
    }

    async function refreshNetworkMetric() {
        const netVal = document.getElementById('net-val');
        const start = performance.now();
        let duration = 0;

        try {
            if (window.location.origin === 'null' || window.location.protocol === 'file:') {
                throw new Error('Offline');
            }
            await fetch(window.location.origin + '?ping=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
            duration = Math.round(performance.now() - start);
            if (netVal) netVal.textContent = `${duration} ms`;
        } catch (e) {
            duration = 0;
            if (netVal) netVal.textContent = "Offline";
        }

        networkSamples.shift();
        networkSamples.push(duration);
        drawMetricGraph('net-chart', networkSamples, 200, '#a6a6a6');
    }

    setInterval(refreshCpuMetric, 1000);
    setInterval(refreshRamMetric, 1500);
    setInterval(refreshNetworkMetric, 2500);

    refreshCpuMetric();
    refreshRamMetric();
    refreshNetworkMetric();
});
  </script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const siteLaunchDate = new Date('2022-09-22T00:00:00');

    function refreshSiteUptime() {
        const now = new Date();

        let years = now.getFullYear() - siteLaunchDate.getFullYear();
        let months = now.getMonth() - siteLaunchDate.getMonth();
        let days = now.getDate() - siteLaunchDate.getDate();

        let hours = now.getHours() - siteLaunchDate.getHours();
        let minutes = now.getMinutes() - siteLaunchDate.getMinutes();
        let seconds = now.getSeconds() - siteLaunchDate.getSeconds();

        if (seconds < 0) {
            seconds += 60;
            minutes--;
        }

        if (minutes < 0) {
            minutes += 60;
            hours--;
        }

        if (hours < 0) {
            hours += 24;
            days--;
        }

        if (days < 0) {
            months--;

            const previousMonth = new Date(
                now.getFullYear(),
                now.getMonth(),
                0
            );

            days += previousMonth.getDate();
        }

        if (months < 0) {
            months += 12;
            years--;
        }

        const pad = (num) => String(num).padStart(2, '0');
        const uptimeElem = document.getElementById('site-uptime');

        if (uptimeElem) {
            uptimeElem.textContent =
                `${years}y ${pad(months)}mo ${pad(days)}d ` +
                `${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
        }
    }

    setInterval(refreshSiteUptime, 1000);
    refreshSiteUptime();
});
</script>

  <script>
const canvas = document.getElementById('tech-canvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

const lightColor = '#ffffff';
const darkColor = '#1a1a1a';

const particles = [];
const particleCount = 60;
let waveAngle = 0;

for (let i = 0; i < particleCount; i++) {
    particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7,
        radius: Math.random() * 2 + 1,
        isDark: Math.random() > 0.5
    });
}

let techActive = false;

function animate() {
    ctx.clearRect(0, 0, width, height);
    if (techActive) waveAngle += 0.008;

    ctx.lineWidth = 1.5;

    ctx.strokeStyle = darkColor;
    ctx.beginPath();
    ctx.globalAlpha = 0.08;
    for (let x = 0; x < width; x++) {
        let y = height * 0.48 + Math.sin(x * 0.004 + waveAngle) * 45;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = lightColor;
    ctx.beginPath();
    ctx.globalAlpha = 0.35;
    for (let x = 0; x < width; x++) {
        let y = height * 0.52 + Math.sin(x * 0.003 - waveAngle * 0.8) * 55;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.isDark ? darkColor : lightColor;
        ctx.globalAlpha = p.isDark ? 0.25 : 0.6;
        ctx.fill();
    });

    ctx.strokeStyle = darkColor;
    ctx.globalAlpha = 0.04;
    for (let i = 0; i < particleCount; i++) {
        for (let j = i + 1; j < particleCount; j++) {
            const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
            if (dist < 130) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
            }
        }
    }

    if (techActive) {
        const scanX = ((waveAngle * 75) % (width + 180)) - 90;
        const scanGradient = ctx.createLinearGradient(scanX - 70, 0, scanX + 70, 0);
        scanGradient.addColorStop(0, "rgba(255, 255, 255, 0)");
        scanGradient.addColorStop(.5, "rgba(255, 255, 255, .055)");
        scanGradient.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = scanGradient;
        ctx.globalAlpha = 1;
        ctx.fillRect(scanX - 70, 0, 140, height);
    }

    requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

animate();
<\/script>

<script>
(function () {

    const bootHum = document.getElementById("boot-hum");
    const bootBeep = document.getElementById("boot-beep");
    const bootScan = document.getElementById("boot-scan");
    const systemOnline = document.getElementById("system-online");

    let audioUnlocked = false;

    if (bootHum) {
        bootHum.preload = "auto";
        bootHum.volume = 0.45;
        bootHum.load();
    }

    if (bootBeep) {
        bootBeep.preload = "auto";
        bootBeep.volume = 0.45;
        bootBeep.load();
    }

    if (bootScan) {
        bootScan.preload = "auto";
        bootScan.volume = 0.35;
        bootScan.load();
    }

    if (systemOnline) {
        systemOnline.preload = "auto";
        systemOnline.volume = 0.65;
        systemOnline.load();
    }

    function playSound(sound) {

        if (!sound) {
            return;
        }

        sound.currentTime = 0;

        const playback = sound.play();

        if (playback !== undefined) {

            playback
                .then(function () {
                    audioUnlocked = true;
                })
                .catch(function () {

                    if (!audioUnlocked) {
                        setTimeout(function () {
                            playSound(sound);
                        }, 250);
                    }

                });

        }

    }

    function tryUnlockAudio() {

        if (!bootBeep) {
            return;
        }

        bootBeep.currentTime = 0;

        const attempt = bootBeep.play();

        if (attempt !== undefined) {

            attempt
                .then(function () {

                    audioUnlocked = true;

                    bootBeep.pause();
                    bootBeep.currentTime = 0;

                })
                .catch(function () {});

        }

    }

    document.addEventListener(
        "pointerdown",
        tryUnlockAudio,
        { once: true }
    );

    document.addEventListener(
        "keydown",
        tryUnlockAudio,
        { once: true }
    );

    document.addEventListener(
        "touchstart",
        tryUnlockAudio,
        { once: true }
    );

    window.i026BootBeep = function () {
        playSound(bootBeep);
    };

    window.i026BootScan = function () {
        playSound(bootScan);
    };

    window.i026SystemOnline = function () {

        if (bootBeep) {
            bootBeep.pause();
            bootBeep.currentTime = 0;
        }

        if (bootScan) {
            bootScan.pause();
            bootScan.currentTime = 0;
        }

        if (systemOnline) {
            playSound(systemOnline);
        }

    };

})();
<\/script>

<script>
(function () {

    const root = document.documentElement;

    const progress =
        document.getElementById("i026-boot-progress");

    const percent =
        document.getElementById("i026-boot-percent");

    const status =
        document.getElementById("i026-boot-status");

    const liveLine =
        document.getElementById("boot-live-line");

    if (
        !progress ||
        !percent ||
        !status ||
        !liveLine
    ) {
        return;
    }

    root.classList.add("loading-lock", "booting");

    const stages = [
        ["LOADING SYSTEM", 18],
        ["MOUNTING INTERFACE", 36],
        ["INDEXING ARCHIVE", 54],
        ["CALIBRATING SIGNAL", 72],
        ["SYNCING VISUAL LAYER", 88]
    ];

    let stage = 0;
    let finished = false;

    function advance() {

        if (
            finished ||
            stage >= stages.length
        ) {
            return;
        }

        const item = stages[stage++];

        status.textContent = item[0];

        percent.textContent =
            item[1] + "%";

        progress.style.transform =
            "scaleX(" +
            (item[1] / 100) +
            ")";

        if (
            stage === 4 &&
            typeof i026BootScan === "function"
        ) {

            i026BootScan();

        } else if (
            typeof i026BootBeep === "function"
        ) {

            i026BootBeep();

        }

        if (stage < stages.length) {

            setTimeout(
                advance,
                450 + Math.random() * 250
            );

        }

    }

    function finishBoot() {

        if (finished) {
            return;
        }

        finished = true;

        progress.style.transform =
            "scaleX(1)";

        percent.textContent =
            "100%";

        status.textContent =
            "SYSTEM ONLINE";

        liveLine.textContent =
            "[OK] CONNECTION ESTABLISHED";

        if (
            typeof i026SystemOnline ===
            "function"
        ) {

            i026SystemOnline();

        }

        setTimeout(function () {

            root.classList.remove(
                "loading-lock",
                "booting"
            );

            root.classList.add(
                "system-online"
            );

            if (
                typeof techActive !==
                "undefined"
            ) {

                techActive = true;

            }

        }, 400);

    }

    liveLine.textContent =
        "[--] INITIALIZING SYSTEM";

    advance();

    window.addEventListener(
        "load",
        function () {

            liveLine.textContent =
                "[OK] CONNECTION ESTABLISHED";

            finishBoot();

        },
        { once: true }
    );

    window.setTimeout(function () {

        if (!finished) {

            status.textContent =
                "SYSTEM ONLINE";

            liveLine.textContent =
                "[WARN] SOME MODULES OFFLINE";

            finishBoot();

        }

    }, 8000);

})();
<\/script>
